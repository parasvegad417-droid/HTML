<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="action.php">
      <label for="username">Username:</label>

      <input type="text" id="username" name="username" required />
      <br />
      <label for="Password">Password:</label>
      <input type="password" id="Password" name="Password" required />
      <br />
      <label for="date">Date:</label>
      <input type="date" id="date" name="date" required />
      <br />
      <label for="file">File:</label>
      <input type="file" id="file" name="file" required />
      <br />
      <label for="color">Color:</label>
      <input type="color" id="color" name="color" required />
      <br />
      <label for="Range">Range:</label>
      <input type="range" id="Range" name="Range" required />
      <br />

      <label for="Male">Male</label>
      <input type="radio" id="Male" name="gender" value="male" required />
      <br />
      <label for="Female">Female</label>
      <input type="radio" id="Female" name="gender" value="female" required />
      <br />
      <label for="others">Others</label>
      <input type="radio" id="others" name="gender" value="others" required />
      <br />

      <label for="Apple">Apple:</label>
      <input type="checkbox" id="Apple" name="Apple" value="apple" />
      <label for="Banana">Banana:</label>
      <input type="checkbox" id="Banana" name="Banana" value="banana" />
      <label for="Cherry">Cherry:</label>
      <input type="checkbox" id="Cherry" name="Cherry" value="cherry" />

      <label for="Fruits">Select Fruits:</label>
      <select id="Fruits" name="Fruits" required>
        <option value="">--Please choose an option--</option>
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
        <option value="cherry">Cherry</option>
      </select>
      <br />
      <label for="textArea">Enter your Address:</label>
      <textarea name="Enter your Address" id="Address" required></textarea>
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
